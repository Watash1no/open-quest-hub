name: "publish"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm64 & x64
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04" # for Linux
            args: ""
          - platform: "windows-latest" # for Windows
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev zsync

      - name: install frontend dependencies
        run: npm install

      - name: verify tauri-cli version (>=2.11.4 required for AppImage .DirIcon fix, see tauri#15488)
        shell: bash
        run: |
          set -e
          VERSION=$(npx --no-install tauri --version 2>/dev/null | awk '{print $2}')
          echo "Installed @tauri-apps/cli: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "::error::tauri-cli not found after npm install"
            exit 1
          fi
          # Compare semver: require >= 2.11.4
          node -e "
            const v = '$VERSION'.split('.').map(Number);
            const need = [2, 11, 4];
            const ok = v[0] > need[0] || (v[0] === need[0] && (v[1] > need[1] || (v[1] === need[1] && v[2] >= need[2])));
            if (!ok) { console.error('::error::tauri-cli $VERSION is too old, need >= 2.11.4 for AppImage .DirIcon fix'); process.exit(1); }
          "

      - name: build openquest-tui
        run: cargo build --manifest-path openquest-tui/Cargo.toml --release

      - name: rename TUI binary for release upload
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              mv openquest-tui/target/release/openquest-tui openquest-tui/target/release/openquest-tui-linux-x86_64
              echo "TUI_BINARY=openquest-tui/target/release/openquest-tui-linux-x86_64" >> "$GITHUB_ENV"
              ;;
            macOS)
              mv openquest-tui/target/release/openquest-tui openquest-tui/target/release/openquest-tui-macos-aarch64
              echo "TUI_BINARY=openquest-tui/target/release/openquest-tui-macos-aarch64" >> "$GITHUB_ENV"
              ;;
            Windows)
              mv openquest-tui/target/release/openquest-tui.exe openquest-tui/target/release/openquest-tui-windows-x86_64.exe
              echo "TUI_BINARY=openquest-tui/target/release/openquest-tui-windows-x86_64.exe" >> "$GITHUB_ENV"
              ;;
          esac

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: "Open Quest Hub v__VERSION__"
          releaseBody: "See the assets below to download the latest version of Open Quest Hub."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: embed AppImage update info and publish .zsync
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          REPO: Watash1no/open-quest-hub
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -e
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          # Tauri's bundler emits exactly one AppImage on Ubuntu; pick it up and
          # fail loudly if that ever stops being the case.
          APPIMAGE="$(find "$APPIMAGE_DIR" -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
          [[ -n "$APPIMAGE" ]] || { echo "::error::No AppImage found in $APPIMAGE_DIR"; exit 1; }
          echo "Patching $APPIMAGE for $REPO @ $TAG"
          REPO="$REPO" TAG="$TAG" scripts/embed-appimage-update-info.sh "$APPIMAGE"

          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.zsync" --clobber; then
              echo "Patched AppImage + .zsync uploaded on attempt $attempt"
              exit 0
            fi
            echo "gh release upload failed on attempt $attempt, retrying in 15s..."
            sleep 15
          done
          echo "::error::Failed to upload patched AppImage + .zsync to release $TAG after 5 attempts"
          exit 1

      - name: upload openquest-tui binary to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if gh release upload "$GITHUB_REF_NAME" "$TUI_BINARY" --clobber; then
              echo "TUI binary uploaded on attempt $attempt"
              exit 0
            fi
            echo "gh release upload failed on attempt $attempt, retrying in 15s..."
            sleep 15
          done
          echo "::error::Failed to upload $TUI_BINARY to release $GITHUB_REF_NAME after 5 attempts"
          exit 1
